services:
  pg_db:
    image: postgres:17-alpine
    restart: always
    environment:
      - POSTGRES_DB=min_db
      - POSTGRES_USER=root
      - POSTGRES_PASSWORD=root
      - LANG=C.UTF-8
      - LC_ALL=C.UTF-8
    volumes:
      - ./postgres-data:/var/lib/postgresql/data
    ports:
      - "5435:5432"
    container_name: bp-min-db
    networks:
      - bp-min
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U root -d min_db"]
      interval: 2s
      timeout: 5s
      retries: 15
      start_period: 15s

  redis:
    image: redis:7-alpine
    restart: always
    ports:
      - "6379:6379"
    container_name: bp-min-redis
    networks:
      - bp-min
    volumes:
      - ./redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 3s
      retries: 10
      start_period: 5s

  client:
    build: ./client
    ports:
      - "5173:5173"
    container_name: bp-min-client
    networks:
      - bp-min
    depends_on:
      redis:
        condition: service_healthy
      pg_db:
        condition: service_healthy

  server:
    build: ./server
    ports:
      - "8080:8080"
    container_name: bp-min-server
    networks:
      - bp-min
    depends_on:
      pg_db:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      - POSTGRES_HOST=pg_db
      - POSTGRES_PORT=5432
      - POSTGRES_DB=min_db
      - POSTGRES_USER=root
      - POSTGRES_PASSWORD=root
      - REDIS_HOST=redis
      - REDIS_PORT=6379

networks:
  bp-min:
    driver: bridge