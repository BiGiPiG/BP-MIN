spring:
  application:
    name: server
  datasource:
    url: jdbc:postgresql://${POSTGRES_HOST:pg_db}:${POSTGRES_PORT:5432}/${POSTGRES_DB:min_db}
    username: ${POSTGRES_USER:root}
    password: ${POSTGRES_PASSWORD:root}
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect

  data:
    redis:
      host: ${REDIS_HOST:redis}
      port: ${REDIS_PORT:6379}
      repositories:
        enabled: false

security:
  jwt:
    secret_key: 4eeab38d706831be4b36612ead768ef8182d1dd6f0e14e5dc934652e297fb16a
    access_token_expiration: 30000000 # 30 seconds
    refresh_token_expiration: 252000000 # 7 days

logging:
  level:
    org:
      springframework:
        web:
          socket: DEBUG
        messaging: TRACE
    io:
      github:
        bigpig:
          server: DEBUG

app:
  cors:
    allowed-origins:
      - "http://localhost:5173"
    allowed-methods:
      - "GET"
      - "POST"
      - "PUT"
      - "DELETE"
      - "PATCH"
    allowed-headers:
      - "Authorization"
      - "Content-Type"
      - "X-Requested-With"
    allow-credentials: true
    max-age: 3600