spring:
  application:
    name: server
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5435}/${DB_NAME:min_db}
    username: ${DB_USER:root}
    password: ${DB_PASSWORD:root}
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: true
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
security:
  jwt:
    secret_key: YOUR_SECRET_KEY
    access_token_expiration: 30_000_000 # 30 seconds
    refresh_token_expiration: 252_000_000 # 7 days
logging:
  level:
    org:
      springframework:
        web:
          socket: DEBUG
        messaging: TRACE

app:
  cors:
    allowed-origins:
      - "http://localhost:5173"
    allowed-methods:
      - "GET"
      - "POST"
      - "PUT"
    allowed-headers:
      - "Authorization"
      - "Content-Type"
    allow-credentials: true
    max-age: 3600